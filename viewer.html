<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ByabshaGhor — Document Viewer</title>
<link rel="stylesheet" href="glossary.css">
<script src="glossary.js" defer></script>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --accent: #22c55e; --accent2: #38bdf8;
    --text: #f1f5f9; --muted: #94a3b8; --line: rgba(148,163,184,.15);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Hind Siliguri', 'Inter', sans-serif; background: #0b1120; color: var(--text); }
  .topbar {
    position: sticky; top: 0; z-index: 10; background: rgba(15,23,42,.95);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
    padding: 14px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .brand { font-weight: 700; font-size: 18px; color: var(--accent); }
  select, button {
    background: var(--card); color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 14px; font-family: inherit; font-size: 14.5px; cursor: pointer;
  }
  select:hover, button:hover { border-color: var(--accent); }
  button.print { background: rgba(34,197,94,.12); color: var(--accent); border-color: rgba(34,197,94,.4); font-weight: 600; }
  .content { max-width: 960px; margin: 0 auto; padding: 40px 28px 80px; }
  #doc h1 { font-size: 32px; color: var(--accent); margin: 0 0 18px; border-bottom: 2px solid rgba(34,197,94,.3); padding-bottom: 12px; }
  #doc h2 { font-size: 23px; color: var(--accent2); margin: 34px 0 14px; }
  #doc h3 { font-size: 18px; color: #e2e8f0; margin: 24px 0 10px; }
  #doc p, #doc li { font-size: 15.5px; line-height: 1.75; color: #dbe4f0; }
  #doc p { margin: 10px 0; }
  #doc ul, #doc ol { padding-left: 26px; margin: 10px 0; }
  #doc li { margin: 5px 0; }
  #doc blockquote {
    border-left: 4px solid var(--accent); background: rgba(34,197,94,.07);
    padding: 14px 18px; border-radius: 0 10px 10px 0; margin: 14px 0; color: #d1fae5;
  }
  #doc blockquote p { color: #d1fae5; }
  #doc table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 14.5px; }
  #doc th { text-align: left; color: var(--accent); background: rgba(34,197,94,.08); padding: 10px 12px; font-size: 13px; border: 1px solid var(--line); }
  #doc td { padding: 9px 12px; border: 1px solid var(--line); color: #dbe4f0; vertical-align: top; }
  #doc tr:nth-child(even) td { background: rgba(30,41,59,.5); }
  #doc code { background: #0b1120; padding: 2px 7px; border-radius: 5px; font-size: 13.5px; color: #fbbf24; }
  #doc pre { background: #0b1120; border: 1px solid var(--line); border-radius: 10px; padding: 18px; overflow-x: auto; margin: 14px 0; }
  #doc pre code { background: none; padding: 0; color: #e2e8f0; font-size: 13.5px; line-height: 1.6; }
  #doc a { color: var(--accent2); text-decoration: none; }
  #doc a:hover { text-decoration: underline; }
  #doc hr { border: none; border-top: 1px solid var(--line); margin: 26px 0; }
  #doc strong { color: #fff; }
  .loading { text-align: center; color: var(--muted); padding: 80px 0; font-size: 17px; }
  .err { text-align: center; color: #fca5a5; padding: 80px 20px; font-size: 16px; }
  @media print {
    .topbar { display: none; }
    body { background: #fff; }
    .content { padding: 0; }
    #doc h1, #doc h2, #doc h3, #doc p, #doc li, #doc td, #doc th, #doc blockquote, #doc blockquote p { color: #111; }
    #doc td, #doc th { border-color: #ccc; }
    #doc th { background: #eee; }
    #doc blockquote { background: #f5f5f5; }
  }
</style>
</head>
<body>

<div class="topbar">
  <span class="brand">ব্যবসাঘর Docs</span>
  <select id="picker" onchange="if(this.value) location.href=this.value">
    <option value="">📄 ডকুমেন্ট বেছে নিন…</option>
    <optgroup label="বিজনেস">
      <option value="market-research.html">Market Research</option>
      <option value="competitor-analysis.html">Competitor Analysis</option>
      <option value="sales-playbook.html">Sales Playbook</option>
      <option value="financial-model.html">Financial Model</option>
    </optgroup>
    <optgroup label="লিগ্যাল ও অপস">
      <option value="founders-agreement.html">Founders' Agreement</option>
      <option value="investor-agreement-guide.html">Investor Agreement Guide</option>
      <option value="company-setup-checklist.html">Company Setup Checklist</option>
      <option value="founder-ops.html">Founder Ops</option>
    </optgroup>
    <optgroup label="প্রেজেন্টেশন">
      <option value="pitch-deck.html">Pitch Deck (English)</option>
      <option value="pitch-deck-bn.html">Pitch Deck (বাংলা)</option>
      <option value="battlecards.html">Battlecards (Internal)</option>
      <option value="company-setup.html">Company Setup (Checklist)</option>
    </optgroup>
    <optgroup label="টেকনিক্যাল">
      <option value="custom-domains.html">Custom Domains</option>
      <option value="job-orders-spec.html">Job Orders Spec</option>
      <option value="offline-sync-contract.html">Offline Sync Contract</option>
    </optgroup>
  </select>
  <button class="print" onclick="window.print()">🖨 Print / Save PDF</button>
  <span style="color:var(--muted); font-size:13px; margin-left:auto">.md এডিট করার পর <code>python build.py</code> চালান</span>
</div>

<div class="content"><div id="doc">
  <div style="text-align:center; padding:80px 20px; color:var(--muted)">
    <p style="font-size:52px; margin-bottom:20px">📚</p>
    <p style="font-size:19px; color:#dbe4f0">উপরের ড্রপডাউন থেকে ডকুমেন্ট বেছে নিন</p>
    <p style="font-size:14px; margin-top:10px">.md ফাইল এডিট করলে <code style="color:#fbbf24">python build.py</code> চালিয়ে HTML আপডেট করুন</p>
  </div>
</div></div>

</body>
</html>
